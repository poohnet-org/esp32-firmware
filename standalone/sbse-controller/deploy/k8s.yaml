# Standalone SBSE controller for Kubernetes.
#
# IMPORTANT: this commands real battery hardware. It MUST run as a single replica
# with the Recreate strategy -- two replicas would fight over the inverter.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbse-controller-config
  labels: { app: sbse-controller }
data:
  SBSE_ENABLED: "true"
  SBSE_HOST: "192.168.110.151"      # <-- your SBSE inverter IP
  SBSE_PORT: "502"
  SBSE_TICK_MS: "300"
  SBSE_GRID_CHARGE_TARGET_W: "-720"
  SBSE_GRID_DISCHARGE_TARGET_W: "-500"
  SBSE_MODBUS_SERVER_ENABLED: "true"
  SBSE_MODBUS_SERVER_PORT: "502"
  SBSE_MODBUS_SERVER_UNIT_ID: "3"
  SBSE_HTTP_ADDR: ":8080"
  SBSE_CONFIG_PATH: "/data/config.json"
  # Optional MQTT mirror:
  # SBSE_MQTT_ENABLED: "true"
  # SBSE_MQTT_BROKER: "tcp://mqtt:1883"
  # SBSE_MQTT_PREFIX: "sbse/"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbse-controller-data
  labels: { app: sbse-controller }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbse-controller
  labels: { app: sbse-controller }
spec:
  replicas: 1                 # singleton -- never scale this up
  strategy:
    type: Recreate            # never run two controllers against one inverter
  selector:
    matchLabels: { app: sbse-controller }
  template:
    metadata:
      labels: { app: sbse-controller }
    spec:
      containers:
        - name: sbse-controller
          image: sbse-controller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sbse-controller-config
          ports:
            - { name: http, containerPort: 8080 }
            - { name: modbus, containerPort: 502 }
          # Binding the privileged port 502 needs NET_BIND_SERVICE. To avoid this,
          # set SBSE_MODBUS_SERVER_PORT to a value > 1024 and drop the capability.
          securityContext:
            runAsNonRoot: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sbse-controller-data
---
apiVersion: v1
kind: Service
metadata:
  name: sbse-controller
  labels: { app: sbse-controller }
spec:
  selector: { app: sbse-controller }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: modbus, port: 502, targetPort: modbus }
